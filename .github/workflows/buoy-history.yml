# Backfills past readings from the Coastal Monitoring network's buoys for a
# range of days (scripts/fetch-buoy-history.mjs), onto the history branch under
# archive/<buoy>/<YYYY-MM>.json. Started by hand, to look back at a swell from
# before we kept a record.
name: Buoy history

on:
  workflow_dispatch:
    inputs:
      from:
        description: 'First day (2026-03-15)'
        type: string
        required: true
      to:
        description: 'Last day (2026-03-17)'
        type: string
        required: true
      sensors:
        description: 'Buoys, comma-separated'
        type: string
        default: 'Whitby,Scarborough,Newbiggin'

permissions:
  contents: write

concurrency:
  group: history
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch and keep
        env:
          CCO_API_KEY: ${{ secrets.CCO_API_KEY }}
          TOKEN: ${{ github.token }}
          FROM: ${{ inputs.from }}
          TO: ${{ inputs.to }}
          SENSORS: ${{ inputs.sensors }}
        run: |
          url="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          h="$RUNNER_TEMP/history"
          git clone -q --depth 1 --branch history "$url" "$h"
          node scripts/fetch-buoy-history.mjs "$FROM" "$TO" "$SENSORS" "$h/archive"
          cd "$h"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'Nothing new'; exit 0; }
          git commit -q -m "Buoy history $FROM to $TO: $SENSORS"
          git push -q "$url" history
