# Keeps the data fresh. GitHub's own schedules are unreliable on a quiet
# repository (they fire hours late or not at all), so this runs as a loop:
# every half hour it starts the wave collector, as soon as NOAA has a new
# complete GFS run it starts the chart job (and, once it's out to +384 h, the
# chart app's frames), and as soon as NOAA's wave model
# has the run out it starts the swell forecast. Every hour it starts the
# freshness check (health.yml), so that keeps running even if GitHub turns
# the check's own schedule off (it does, on a repository quiet for 60 days;
# runs started here don't stop). After about five and a half hours
# it starts the next copy of itself (GitHub lets a workflow start another with
# workflow_dispatch). Its own schedule is only a backstop to restart the loop
# if it ever stops; the concurrency group keeps it to one loop at a time.
name: Keep the data fresh

on:
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Waves every half hour, charts and the forecast after each run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          end=$(( $(date +%s) + 330 * 60 ))
          last_waves=0
          last_charts=0
          last_fc=0
          last_frames=0
          last_health=0
          while [ "$(date +%s)" -lt "$end" ]; do
            now=$(date +%s)
            if [ $(( now - last_waves )) -ge 1800 ]; then
              gh workflow run waves.yml --ref main && last_waves=$now && echo "$(date -u +%H:%M) waves started"
            fi
            published=$(curl -fsS "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/charts/manifest.json?t=${now}" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["runLabel"])' || true)
            latest=$(python3 scripts/gfs_latest.py 2>/dev/null || true)
            if [ -n "$latest" ] && [ "$published" != "$latest" ] && [ $(( now - last_charts )) -ge 1800 ]; then
              gh workflow run charts.yml --ref main && last_charts=$now && echo "$(date -u +%H:%M) charts started for $latest (published: ${published:-none})"
            fi
            # "partial" if the published run stopped short, so it's tried again.
            frames=$(python3 scripts/published.py "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/frames/" || true)
            full=$(python3 scripts/gfs_latest.py full 2>/dev/null || true)
            if [ -n "$full" ] && [ "$frames" != "$full" ] && [ $(( now - last_frames )) -ge 1800 ]; then
              gh workflow run frames.yml --ref main && last_frames=$now && echo "$(date -u +%H:%M) frames started for $full (published: ${frames:-none})"
            fi
            if [ $(( now - last_health )) -ge 3600 ]; then
              gh workflow run health.yml --ref main && last_health=$now
            fi
            wave=$(python3 scripts/gfs_latest.py wave 2>/dev/null || true)
            if [ -n "$wave" ] && [ $(( now - last_fc )) -ge 1800 ] && \
               ! curl -fsSI "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/history/forecasts/${wave}.json?t=${now}" > /dev/null 2>&1; then
              gh workflow run forecast.yml --ref main && last_fc=$now && echo "$(date -u +%H:%M) forecast started for $wave"
            fi
            sleep 300
          done
      - name: Hand over to the next loop
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run tick.yml --ref main
