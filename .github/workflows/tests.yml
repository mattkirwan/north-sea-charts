# The tests in tests/: the chart app's frame format end to end (Python's
# encoder against app.js's own decoder, under Node), the checks a frame must
# pass before it's published, publishing (partial runs, and the copy to R2
# against a stand-in S3 server, with the runner's own AWS CLI), and the
# hourly freshness check, which run the jobs draw; and the app itself in
# Chromium, on a made-up run from a local server, offline too. No network
# beyond installing. Also that every job's pinned requirements still install
# on the jobs' Python.
#
# On pull requests only: the check to require before merging to main. Not
# run again on the merge: staging (staging.yml) deploys straight away.
name: Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: pip install -q -r requirements/tests.txt && python -m playwright install --with-deps chromium
      - name: The jobs' requirements install
        run: |
          for f in frames charts forecast; do
            pip install -q --dry-run --ignore-installed -r requirements/$f.txt > /dev/null
            echo "$f: ok"
          done
      - name: Syntax of the app's scripts
        run: node --check i18n.js && node --check grid.js && node --check hints.js && node --check app.js && node --check sw.js && node --check feedback/worker.mjs && node --check feedback/mail.mjs
      - name: Run the tests
        run: aws --version && python -m unittest discover -s tests -v
