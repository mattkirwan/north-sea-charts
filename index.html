<!doctype html>
<html lang="en-GB" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#EEEEEB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="North Sea">
<title>North Sea Surf</title>
<script>
  // One flag, off by default: the prediction system (the old app, with its
  // forecasts, buoys and reports). ?prediction=1 turns it on for this phone,
  // ?prediction=0 off again.
  (function () {
    try {
      var q = new URLSearchParams(location.search).get('prediction');
      if (q === '1') localStorage.setItem('nss.prediction', '1');
      if (q === '0') localStorage.removeItem('nss.prediction');
      if (localStorage.getItem('nss.prediction') === '1') location.replace('legacy.html' + location.hash);
    } catch (e) {}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="ds/tokens.css">
<link rel="stylesheet" href="ds/components/bundle.css">
<style>
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body { position: fixed; inset: 0; overflow: hidden; background: var(--chart-sea); color: var(--ui-ink);
    font-family: var(--font-mono); -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; overscroll-behavior: none; }
  #chart { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .nss-panel { position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; }
  .nss-timeline { touch-action: none; cursor: grab; }
  .nss-track { position: absolute; left: 50%; top: 0; bottom: 0; will-change: transform; }
  .nss-end { left: auto; right: auto; width: 2000px; }
  .nss-tip { pointer-events: none; }
  .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="chart" aria-label="Weather chart of the North Sea and the seas round it. Drag to move the map, pinch to zoom, double-tap to zoom in." role="img"></canvas>
<div class="nss-panel" id="panel">
  <div class="nss-keyrow" id="keyrow" hidden>
    <div class="nss-key" id="key"></div>
    <div class="nss-switch" id="swellSwitch" role="group" aria-label="Swell measure" hidden>
      <button type="button" data-var="height" aria-pressed="true">Height</button>
      <button type="button" data-var="period" aria-pressed="false">Period</button>
    </div>
  </div>
  <div class="nss-bands" role="group" aria-label="Chart layer">
    <button type="button" class="nss-band" data-band="pressure" aria-pressed="true">Pressure</button>
    <button type="button" class="nss-band" data-band="wind" aria-pressed="false">Wind</button>
    <button type="button" class="nss-band" data-band="swell" aria-pressed="false">Swell</button>
  </div>
  <div class="nss-readout" id="readout" role="group" aria-label="Forecast time">
    <span class="nss-readout-day" id="rDay">–</span>
    <span class="nss-readout-lead" id="rLead"></span>
    <span class="nss-readout-time" id="rTime">–</span>
    <span class="nss-readout-status" id="rStatus" hidden></span>
  </div>
  <div class="nss-timeline" id="timeline" role="slider" tabindex="0" aria-label="Forecast timeline" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0">
    <span class="nss-timeline-arrow"></span>
    <div class="nss-scale" id="scale">
      <div class="nss-track" id="track"></div>
      <span class="nss-needle"></span>
      <span class="nss-tip" id="tip" hidden></span>
    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
